<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6fb8">
<title>Fontaines autour de moi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --blue: #0b6fb8; --blue-dark: #08507f; --bg: #f5f8fb; --text: #1b2733;
    --muted: #5f6f7f; --card: #fff; --border: #dde5ec; --warn: #b26b00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header {
    display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem;
    padding-top: calc(.6rem + env(safe-area-inset-top));
    background: var(--blue); color: #fff;
  }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1; font-weight: 600; }
  header select, header button {
    font: inherit; font-size: .9rem; border: 0; border-radius: 8px; padding: .4rem .6rem;
  }
  header button { background: #fff; color: var(--blue); font-weight: 600; cursor: pointer; }
  #map { flex: 1 1 55%; min-height: 220px; }
  #panel {
    flex: 1 1 45%; overflow-y: auto; background: var(--card); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #status { padding: .6rem .9rem; font-size: .9rem; color: var(--muted); border-bottom: 1px solid var(--border); }
  #status.error { color: #b00020; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: .7rem; align-items: center; padding: .65rem .9rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  li:hover, li.active { background: #eef5fb; }
  .dist { min-width: 4.2rem; text-align: right; font-weight: 700; color: var(--blue-dark); }
  .dist small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .2rem; }
  .tag { font-size: .72rem; background: #e8f0f7; color: var(--blue-dark); padding: .1rem .4rem; border-radius: 999px; }
  .tag.warn { background: #fdf0dc; color: var(--warn); }
  a.go {
    flex: none; text-decoration: none; background: var(--blue); color: #fff; font-size: .8rem;
    padding: .4rem .6rem; border-radius: 8px; font-weight: 600;
  }
  #searchHere {
    position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); margin-top: .6rem;
    border: 0; border-radius: 999px; padding: .5rem 1rem; background: #fff; color: var(--blue);
    font: inherit; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; display: none;
  }
  .wrap { position: relative; flex: 1 1 55%; display: flex; flex-direction: column; }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(26,115,232,.4); }
  .drop { font-size: 22px; line-height: 22px; text-align: center; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
  footer { font-size: .72rem; color: var(--muted); padding: .6rem .9rem; }
  @media (min-width: 800px) {
    body { flex-direction: column; }
    main { flex: 1; display: flex; min-height: 0; }
    .wrap { flex: 1 1 65%; }
    #panel { flex: 0 0 380px; border-top: 0; border-left: 1px solid var(--border); }
  }
  @media (max-width: 799px) { main { flex: 1; display: flex; flex-direction: column; min-height: 0; } }
</style>
</head>
<body>
<header>
  <h1>💧 Fontaines autour de moi</h1>
  <select id="radius" aria-label="Rayon de recherche">
    <option value="500">500 m</option>
    <option value="1000" selected>1 km</option>
    <option value="2000">2 km</option>
    <option value="5000">5 km</option>
  </select>
  <button id="locate">📍 Me localiser</button>
</header>
<main>
  <div class="wrap">
    <button id="searchHere">🔎 Chercher dans cette zone</button>
    <div id="map"></div>
  </div>
  <section id="panel">
    <div id="status">Appuie sur « Me localiser » pour trouver les fontaines proches.</div>
    <ul id="list"></ul>
    <footer>
      Données © contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL), via l'API Overpass.
      Certaines fontaines sont coupées l'hiver : vérifie sur place.
    </footer>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
  ];
  const WALK_M_PER_MIN = 80;

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), listEl = $('list'), radiusEl = $('radius'), searchHereBtn = $('searchHere');

  const map = L.map('map', { zoomControl: true }).setView([45.764, 4.8357], 13); // Lyon par défaut
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap',
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);
  let meMarker = null, accuracyCircle = null, radiusCircle = null;
  let origin = null;          // point de référence pour les distances
  let markersById = new Map();
  let lastSearchCenter = null;

  const dropIcon = L.divIcon({ className: 'drop', html: '💧', iconSize: [22, 22], iconAnchor: [11, 11] });
  const meIcon = L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });

  try { const r = localStorage.getItem('fontaines.radius'); if (r) radiusEl.value = r; } catch (_) {}

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', isError);
  }

  function haversine(a, b) {
    const R = 6371000, toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function fmtDist(m) { return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`; }
  function fmtWalk(m) { const min = Math.max(1, Math.round(m / WALK_M_PER_MIN)); return `${min} min`; }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function buildQuery(lat, lng, r) {
    const a = `(around:${r},${lat},${lng})`;
    return `[out:json][timeout:25];
(
  nwr["amenity"="drinking_water"]["drinking_water"!="no"]${a};
  nwr["amenity"="water_point"]["drinking_water"!="no"]${a};
  nwr["man_made"="water_tap"]["drinking_water"="yes"]${a};
  nwr["amenity"="fountain"]["drinking_water"="yes"]${a};
  nwr["natural"="spring"]["drinking_water"="yes"]${a};
);
out center tags;`;
  }

  async function overpass(query) {
    let lastErr;
    for (const url of ENDPOINTS) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 30000);
        const res = await fetch(url, {
          method: 'POST', body: 'data=' + encodeURIComponent(query),
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctrl.signal,
        });
        clearTimeout(t);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('Overpass injoignable');
  }

  function describe(tags) {
    const t = [];
    if (tags.seasonal && tags.seasonal !== 'no') t.push({ label: tags.seasonal === 'yes' ? 'Saisonnière' : `Saisonnière (${tags.seasonal})`, warn: true });
    if (tags.disused === 'yes' || tags['disused:amenity']) t.push({ label: 'Hors service ?', warn: true });
    if (tags.access && !['yes', 'public', 'permissive'].includes(tags.access)) t.push({ label: `Accès : ${tags.access}`, warn: true });
    if (tags.fee === 'yes') t.push({ label: 'Payant', warn: true });
    if (tags.opening_hours) t.push({ label: `🕒 ${tags.opening_hours}` });
    if (tags.bottle === 'yes') t.push({ label: 'Remplir une gourde' });
    if (tags.wheelchair === 'yes') t.push({ label: '♿ Accessible' });
    if (tags.fountain === 'bubbler') t.push({ label: 'Jet' });
    if (tags.man_made === 'water_tap') t.push({ label: 'Robinet' });
    if (tags.natural === 'spring') t.push({ label: 'Source' });
    if (tags.amenity === 'water_point') t.push({ label: 'Point d\'eau' });
    if (tags.dog === 'yes') t.push({ label: '🐕 Gamelle' });
    return t;
  }

  function title(tags) {
    return tags.name || tags.description || tags.operator ||
      (tags.amenity === 'fountain' ? 'Fontaine' : tags.man_made === 'water_tap' ? 'Robinet d\'eau potable' : 'Fontaine à boire');
  }

  function directionsUrl(p) {
    return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`;
  }

  function render(items) {
    markersLayer.clearLayers();
    markersById = new Map();
    listEl.innerHTML = '';

    items.forEach((it) => {
      const tagsHtml = describe(it.tags).map((x) => `<span class="tag${x.warn ? ' warn' : ''}">${esc(x.label)}</span>`).join('');
      const popup = `<strong>${esc(title(it.tags))}</strong><br>${fmtDist(it.dist)} · ${fmtWalk(it.dist)} à pied<br>
        <div class="tags" style="margin:.3rem 0">${tagsHtml}</div>
        <a href="${directionsUrl(it)}" target="_blank" rel="noopener">Itinéraire →</a>`;
      const m = L.marker([it.lat, it.lng], { icon: dropIcon }).bindPopup(popup).addTo(markersLayer);
      markersById.set(it.id, m);

      const li = document.createElement('li');
      li.dataset.id = it.id;
      li.innerHTML = `
        <div class="dist">${fmtDist(it.dist)}<small>${fmtWalk(it.dist)}</small></div>
        <div class="info"><div class="name">${esc(title(it.tags))}</div><div class="tags">${tagsHtml}</div></div>
        <a class="go" href="${directionsUrl(it)}" target="_blank" rel="noopener">Y aller</a>`;
      li.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        document.querySelectorAll('li.active').forEach((x) => x.classList.remove('active'));
        li.classList.add('active');
        map.setView([it.lat, it.lng], Math.max(map.getZoom(), 17));
        m.openPopup();
      });
      m.on('click', () => {
        document.querySelectorAll('li.active').forEach((x) => x.classList.remove('active'));
        li.classList.add('active');
        li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      listEl.appendChild(li);
    });
  }

  async function search(center) {
    const r = parseInt(radiusEl.value, 10);
    lastSearchCenter = center;
    searchHereBtn.style.display = 'none';
    setStatus('Recherche des fontaines…');
    if (radiusCircle) radiusCircle.remove();
    radiusCircle = L.circle(center, { radius: r, color: '#0b6fb8', weight: 1, fillOpacity: 0.04, interactive: false }).addTo(map);

    try {
      const data = await overpass(buildQuery(center.lat, center.lng, r));
      const ref = origin || center;
      const seen = new Set();
      const items = data.elements
        .map((el) => {
          const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon;
          if (lat == null) return null;
          return { id: `${el.type}/${el.id}`, lat, lng, tags: el.tags || {} };
        })
        .filter((x) => x && !seen.has(x.id) && seen.add(x.id))
        .map((x) => ({ ...x, dist: haversine(ref, x) }))
        .sort((a, b) => a.dist - b.dist);

      render(items);
      if (!items.length) {
        setStatus(`Aucune fontaine référencée dans un rayon de ${fmtDist(r)}. Essaie un rayon plus grand.`);
      } else {
        const n = items.length;
        setStatus(`${n} point${n > 1 ? 's' : ''} d'eau potable — le plus proche à ${fmtDist(items[0].dist)} (${fmtWalk(items[0].dist)} à pied).`);
        map.fitBounds(radiusCircle.getBounds(), { padding: [10, 10] });
      }
    } catch (e) {
      setStatus('Impossible de joindre le service de données (Overpass). Réessaie dans un instant.', true);
    }
  }

  function locate() {
    if (!('geolocation' in navigator)) { setStatus('La géolocalisation n\'est pas disponible sur ce navigateur.', true); return; }
    setStatus('Localisation en cours…');
    navigator.geolocation.getCurrentPosition((pos) => {
      const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      origin = p;
      if (meMarker) { meMarker.setLatLng(p); accuracyCircle.setLatLng(p).setRadius(pos.coords.accuracy); }
      else {
        meMarker = L.marker(p, { icon: meIcon, zIndexOffset: 1000 }).bindPopup('Vous êtes ici').addTo(map);
        accuracyCircle = L.circle(p, { radius: pos.coords.accuracy, color: '#1a73e8', weight: 0, fillOpacity: 0.12, interactive: false }).addTo(map);
      }
      search(p);
    }, (err) => {
      const msg = err.code === 1
        ? 'Accès à la position refusé. Autorise la localisation, ou déplace la carte puis « Chercher dans cette zone ».'
        : 'Position introuvable. Déplace la carte puis « Chercher dans cette zone ».';
      setStatus(msg, true);
      searchHereBtn.style.display = 'block';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  }

  $('locate').addEventListener('click', locate);
  radiusEl.addEventListener('change', () => {
    try { localStorage.setItem('fontaines.radius', radiusEl.value); } catch (_) {}
    if (lastSearchCenter) search(lastSearchCenter);
  });
  searchHereBtn.addEventListener('click', () => {
    const c = map.getCenter();
    origin = null; // les distances sont alors calculées depuis le centre de la carte
    if (meMarker) origin = meMarker.getLatLng();
    search({ lat: c.lat, lng: c.lng });
  });
  map.on('moveend', () => {
    if (!lastSearchCenter) { searchHereBtn.style.display = 'block'; return; }
    const moved = haversine(lastSearchCenter, map.getCenter());
    searchHereBtn.style.display = moved > parseInt(radiusEl.value, 10) / 2 ? 'block' : 'none';
  });

  locate(); // tente directement au chargement
})();
</script>
</body>
</html>
